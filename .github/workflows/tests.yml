name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -e '.[dev,node]'
      - run: python -m pytest tests -q
      - run: python -m scripts.evaluate_corpus --offline --output reports/ci-corpus --min-coverage 0.70

  report_ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare report fixture
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.html_report import generate_html_report
          output = Path("reports/ui-fixture")
          output.mkdir(parents=True)
          states = ["reachable", "unknown", "unsupported", "no_path_found"]
          findings = [{"cve": "CVE-TEST-" + str(i), "package": "package" + str(i),
              "purl": "pkg:npm/package" + str(i) + "@1", "installed_version": "1",
              "severity": "HIGH" if i % 2 else "CRITICAL", "description": "A sample finding",
              "reachability": {"status": state, "reasons": ["fixture_reason"]}}
              for i, state in enumerate(states)]
          findings[0]["ai_reviews"] = [{"provider": "preview", "model": "not_called", "status": "preview",
              "evidence_packet": {"evidence": [{"id": "e1", "kind": "source_excerpt", "value": {
                  "symbol": "fixture.function", "relative_path": "fixture.py", "whole_definition": True,
                  "code": 'def function(): return "<script>bad()</script>"', "provenance": "ui_fixture_only",
                  "excerpt_start_line": 1, "excerpt_end_line": 1, "file_sha256": "fixture"}}]}}]
          findings[0]["reachability"]["module_lookup_summary"] = {"scope": "scan_wide_candidates",
              "binding_resolution_scope": "direct_commonjs_require_identity_only",
              "counts": {"by_status": {"resolved": 3}, "commonjs_bindings": {"verified_commonjs_wrapper": 3}},
              "symbol_summary": {"counts": {"by_status": {"modeled_function_target": 1, "unresolved": 2}},
                  "application_examples": [{"caller_file": "fixture.js", "caller_line": 1,
                      "target_name": "<script>bad()</script>", "target_file": "dependency.js", "target_line": 2}]}}
          components = [{"name": "package" + str(i), "version": "1", "purl": "pkg:npm/package" + str(i) + "@1"} for i in range(180)]
          (output / "sbom.json").write_text(json.dumps({"components": components}), encoding="utf-8")
          (output / "findings.json").write_text(json.dumps(findings), encoding="utf-8")
          generate_html_report("UI fixture", output / "sbom.json", output / "findings.json", output / "report.html")
          PY
      - name: Install isolated DOM test dependencies
        run: npm install --prefix reports/report-dom-tools --ignore-scripts --no-audit --no-fund jsdom@26.1.0 d3@7.9.0
      - name: Verify filters and optional graph without network resources
        run: node tests/report_dom_check.cjs reports/ui-fixture/report.html

  node_resolution:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: pip install -e '.[dev,node]'
      - name: Check Node paths and authored scope/value oracles
        env:
          DEPREACH_REQUIRE_NODE_ORACLE: '1'
          DEPREACH_NODE_ORACLE_REPORT: reports/node-oracle.jsonl
          DEPREACH_NODE_BINDING_ORACLE_REPORT: reports/node-binding-oracle.jsonl
        run: python -m pytest tests/test_node_resolution.py tests/test_node_imports.py tests/test_javascript_bindings.py tests/test_node_symbols.py -q
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: node-resolution-${{ matrix.node }}
          path: |
            reports/node-oracle.jsonl
            reports/node-binding-oracle.jsonl
          if-no-files-found: error
